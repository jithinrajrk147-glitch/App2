name: Build APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Download Website ZIP
        run: |
          curl -L \
          https://github.com/jithinrajrk147-glitch/Anxro/archive/refs/heads/main.zip \
          -o website.zip

      - name: Extract Website
        run: unzip website.zip

      - name: Create WWW ZIP
        run: |
          cd Anxro-main
          zip -r ../www.zip .

      - name: Move ZIP To Assets
        run: |
          mkdir -p android/app/src/main/assets
          mv www.zip android/app/src/main/assets/www.zip

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Permission
        run: chmod +x gradlew
        working-directory: android

      - name: Build APK
        run: ./gradlew assembleDebug
        working-directory: android

      - name: Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
